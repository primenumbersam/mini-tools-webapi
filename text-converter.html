<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Text Converter</title>
  <style>
    :root {
      --bg-app: #f8fafc;
      --bg-card: #ffffff;
      --bg-subtle: #f1f5f9;
      --bg-input: #ffffff;
      --border: #e2e8f0;
      --border-focus: #2563eb;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --primary-border: #bfdbfe;
      --accent-encode: #7c3aed;
      --accent-encode-soft: #f5f3ff;
      --danger: #ef4444;
      --success: #10b981;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 20px 25px -5px rgba(15, 23, 42, 0.15);
      --mono-font: 'JetBrains Mono', 'D2Coding', 'Consolas', 'Malgun Gothic', monospace;
      --sans-font: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Malgun Gothic', sans-serif;
    }

    [data-theme="dark"] {
      --bg-app: #090d16;
      --bg-card: #0f172a;
      --bg-subtle: #1e293b;
      --bg-input: #090d16;
      --border: #334155;
      --border-focus: #3b82f6;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --primary-soft: #1e3a8a;
      --primary-border: #2563eb;
      --accent-encode: #a78bfa;
      --accent-encode-soft: #2e1065;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-app);
      color: var(--text-main);
      font-family: var(--sans-font);
      line-height: 1.5;
      padding: 20px 16px 48px;
      min-height: 100vh;
    }

    .container {
      max-width: 1260px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header */
    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 4px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--primary);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand-sub {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Buttons & Controls */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 34px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 0.8125rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.14s ease;
      user-select: none;
      white-space: nowrap;
    }

    .btn:hover:not(:disabled) {
      background: var(--bg-subtle);
      border-color: var(--text-muted);
    }

    .btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
      color: #ffffff;
    }

    .btn-soft {
      background: var(--primary-soft);
      color: var(--primary);
      border-color: var(--primary-border);
    }

    .btn svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .toggle-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 34px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      user-select: none;
    }
    .toggle-pill input {
      accent-color: var(--primary);
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    /* Dual Editor Grid */
    .editor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 860px) {
      .editor-grid {
        grid-template-columns: 1fr;
      }
    }

    .pane-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .pane-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border);
      gap: 8px;
      flex-wrap: wrap;
    }

    .pane-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pane-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }

    .active-op-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid var(--primary-border);
    }

    .pane-toolbar {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .btn-xs {
      height: 27px;
      padding: 0 9px;
      font-size: 0.76rem;
      border-radius: 6px;
    }

    .pane-textarea {
      width: 100%;
      height: 240px;
      padding: 14px;
      border: none;
      outline: none;
      resize: vertical;
      background: var(--bg-input);
      color: var(--text-main);
      font-family: var(--mono-font);
      font-size: 0.92rem;
      line-height: 1.6;
    }

    .pane-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      border-top: 1px solid var(--border);
      background: var(--bg-card);
      font-size: 0.76rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      flex-wrap: wrap;
      gap: 8px;
    }

    .metrics-list {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .metrics-list b {
      color: var(--text-main);
      font-weight: 700;
    }

    /* Conversion Control Deck */
    .deck-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .deck-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .cat-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .cat-tab {
      height: 32px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: var(--bg-subtle);
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.14s;
    }

    .cat-tab:hover {
      color: var(--text-main);
    }

    .cat-tab.active {
      background: var(--primary);
      color: #ffffff;
    }

    .deck-options {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Decode Mode Switch for Encode Category */
    .encode-mode-switch {
      display: inline-flex;
      background: var(--bg-subtle);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .encode-mode-btn {
      padding: 4px 10px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
    }

    .encode-mode-btn.active {
      background: var(--accent-encode);
      color: #ffffff;
    }

    /* Conversion Buttons Grid */
    .conv-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .conv-section-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .conv-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 8px;
    }

    .conv-btn {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.12s ease;
      text-align: left;
      min-height: 52px;
    }

    .conv-btn:hover {
      border-color: var(--primary);
      background: var(--bg-subtle);
      transform: translateY(-1px);
    }

    .conv-btn.active {
      background: var(--primary-soft);
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary);
    }

    .conv-btn-name {
      font-size: 0.84rem;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 2px;
      word-break: break-all;
    }

    .conv-btn-preview {
      font-size: 0.71rem;
      color: var(--text-muted);
      font-family: var(--mono-font);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      width: 100%;
    }

    /* Available Conversions Help Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-window {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 880px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-subtle);
      gap: 12px;
      flex-wrap: wrap;
    }

    .modal-title {
      font-size: 1.05rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-search {
      height: 34px;
      width: 260px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 0.83rem;
      outline: none;
    }
    .modal-search:focus {
      border-color: var(--primary);
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .help-category-title {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 2px solid var(--primary-border);
      display: inline-block;
    }

    .help-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    .help-table th,
    .help-table td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }

    .help-table th {
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.75rem;
      text-transform: uppercase;
      background: var(--bg-subtle);
    }

    .help-code {
      font-family: var(--mono-font);
      background: var(--bg-subtle);
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 0.78rem;
      white-space: nowrap;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1e293b;
      color: #f8fafc;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 200;
      box-shadow: var(--shadow-lg);
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Top Header -->
  <header class="header">
    <div class="brand-wrap">
      <div class="brand-icon">Aa</div>
      <div>
        <h1 class="brand-title">Mini Text Converter</h1>
        <p class="brand-sub">대소문자, 개발 변수명 케이스, 인코딩/디코딩, 유니코드 스타일 올인원 변환기</p>
      </div>
    </div>

    <div class="header-actions">
      <button class="btn" id="sampleBtn" title="테스트용 샘플 문장 불러오기">
        샘플 텍스트
      </button>

      <button class="btn btn-soft" id="openHelpBtn" title="Available Conversions 전체 설명 및 예시 보기">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Available Conversions (도움말)
      </button>

      <button class="btn" id="themeToggleBtn" title="라이트 / 다크 모드 전환">
        <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        테마
      </button>
    </div>
  </header>

  <!-- Dual View: Left Input & Right Output -->
  <section class="editor-grid">
    <!-- Input Pane -->
    <div class="pane-card">
      <div class="pane-header">
        <div class="pane-title-group">
          <span class="pane-title">원본 입력 (Input)</span>
        </div>
        <div class="pane-toolbar">
          <button class="btn btn-xs" id="pasteBtn" title="클립보드에서 붙여넣기">붙여넣기</button>
          <button class="btn btn-xs" id="openFileBtn" title="로컬 텍스트 파일 불러오기">파일 열기</button>
          <button class="btn btn-xs" id="clearInputBtn" title="입력창 비우기">비우기</button>
          <input type="file" id="fileInput" accept=".txt,.md,.json,.csv,.js,.py,.html,.css,.log" style="display:none">
        </div>
      </div>

      <textarea
        id="inputText"
        class="pane-textarea"
        placeholder="여기에 변환할 텍스트를 입력하거나 붙여넣으세요..."
        spellcheck="false"
      ></textarea>

      <div class="pane-footer">
        <div class="metrics-list" id="inputMetrics">
          <span>글자: <b>0</b></span>
          <span>단어: <b>0</b></span>
          <span>줄: <b>0</b></span>
          <span>문장: <b>0</b></span>
          <span>바이트: <b>0 B</b></span>
        </div>
      </div>
    </div>

    <!-- Result Pane -->
    <div class="pane-card">
      <div class="pane-header">
        <div class="pane-title-group">
          <span class="pane-title">변환 결과 (Result)</span>
          <span class="active-op-badge" id="activeOpBadge">camelCase</span>
        </div>
        <div class="pane-toolbar">
          <button class="btn btn-xs btn-soft" id="chainToInputBtn" title="결과를 왼쪽 입력창으로 보내 연속 변환 (Copy to Input)">
            ← 입력창으로 보내기
          </button>
          <button class="btn btn-xs" id="saveResultBtn" title="변환 결과를 텍스트 파일로 저장">저장</button>
          <button class="btn btn-xs btn-primary" id="copyResultBtn" title="결과 복사하기">
            복사 (Copy)
          </button>
        </div>
      </div>

      <textarea
        id="outputText"
        class="pane-textarea"
        placeholder="변환 버튼을 클릭하면 결과가 여기에 표시됩니다."
        spellcheck="false"
      ></textarea>

      <div class="pane-footer">
        <div class="metrics-list" id="outputMetrics">
          <span>글자: <b>0</b></span>
          <span>단어: <b>0</b></span>
          <span>줄: <b>0</b></span>
          <span>바이트: <b>0 B</b></span>
        </div>
      </div>
    </div>
  </section>

  <!-- Conversion Control Deck -->
  <section class="deck-card">
    <div class="deck-top">
      <!-- Category Filter Tabs -->
      <div class="cat-tabs" id="categoryTabs">
        <button class="cat-tab active" data-cat="all">전체 보기</button>
        <button class="cat-tab" data-cat="basic">기본 (Basic)</button>
        <button class="cat-tab" data-cat="programming">개발 (Programming)</button>
        <button class="cat-tab" data-cat="clean">정리/라인 (Clean)</button>
        <button class="cat-tab" data-cat="fun">효과 (Fun)</button>
        <button class="cat-tab" data-cat="encode">인코딩 (Encode/Decode)</button>
        <button class="cat-tab" data-cat="unicode">유니코드 (Unicode)</button>
      </div>

      <!-- Execution Options -->
      <div class="deck-options">
        <!-- Encode / Decode Direction Switch -->
        <div class="encode-mode-switch" title="인코딩(Encode) 또는 복호화(Decode) 방향 선택">
          <button class="encode-mode-btn active" id="modeEncodeBtn">Encode (변환)</button>
          <button class="encode-mode-btn" id="modeDecodeBtn">Decode (복원)</button>
        </div>

        <label class="toggle-pill" title="프로그래밍 케이스 변환 시 줄(Line) 단위로 각각 분리하여 변환합니다.">
          <input type="checkbox" id="lineByLineCheck" checked>
          줄 단위 개별 처리
        </label>

        <label class="toggle-pill" title="입력창에 타이핑할 때마다 선택된 변환을 실시간으로 적용합니다.">
          <input type="checkbox" id="liveModeCheck" checked>
          실시간 자동 변환
        </label>
      </div>
    </div>

    <!-- Dynamic Conversion Buttons Container -->
    <div id="conversionsContainer" style="display: flex; flex-direction: column; gap: 16px;"></div>
  </section>
</div>

<!-- Available Conversions Help Modal -->
<div class="modal-backdrop" id="helpModal">
  <div class="modal-window">
    <div class="modal-header">
      <div class="modal-title">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="var(--primary)" stroke-width="2.2" fill="none"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Available Conversions (변환 규칙 및 예시 가이드)
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <input type="text" class="modal-search" id="helpSearchInput" placeholder="변환 이름 또는 설명 검색 (예: snake, base64)...">
        <button class="btn" id="closeHelpBtn">닫기 (Esc)</button>
      </div>
    </div>

    <div class="modal-body" id="helpModalBody"></div>
  </div>
</div>

<!-- Toast Feedback -->
<div class="toast" id="toastBox">클립보드에 복사되었습니다.</div>

<script>
  /**
   * Mini Text Converter - Pure Web API Text Case, Encoding & Unicode Transformer
   * Inspired by asciiart.eu/tools/case-converter with enhanced bidirectional decoding,
   * smart acronym word boundary detection, Korean-friendly slug, and searchable Help Modal.
   */

  const STORAGE_KEY = 'mini_text_converter_state_v1';
  const utf8Encoder = new TextEncoder();

  // --- Smart Word Boundary Tokenizer for Programming Cases ---
  // Preserves acronyms cleanly: "parseHTMLString" -> ["parse", "HTML", "String"]
  function splitWords(str, keepKorean = false) {
    if (!str) return [];
    const normalized = str.normalize('NFKD').replace(/[\u0300-\u036f]/g, '');
    const pattern = keepKorean
      ? /[A-Z]+(?=[A-Z][a-z]|\b)|[A-Z]?[a-z]+|[0-9]+|[가-힣]+/g
      : /[A-Z]+(?=[A-Z][a-z]|\b)|[A-Z]?[a-z]+|[0-9]+/g;
    return normalized.match(pattern) || [];
  }

          const words = splitWords(line, true);
          return words.length ? joinerFn(words) : line.trim();

    }
    const words = splitWords(text, true);
    return words.length ? joinerFn(words) : '';
  }

  // --- Unicode Mathematical & Aesthetic Character Mappers ---
  function mapByOffset(str, upperStart, lowerStart, digitStart = null, exceptions = {}) {
    return Array.from(str).map(ch => {
      if (exceptions[ch]) return exceptions[ch];
      const code = ch.codePointAt(0);
      if (code >= 65 && code <= 90 && upperStart) {
        return String.fromCodePoint(upperStart + (code - 65));
      }
      if (code >= 97 && code <= 122 && lowerStart) {
        return String.fromCodePoint(lowerStart + (code - 97));
      }
      if (digitStart && code >= 48 && code <= 57) {
        return String.fromCodePoint(digitStart + (code - 48));
      }
      return ch;
    }).join('');
  }

      fn: (t) => Array.from(t).reverse().map(c => MIRROR_MAP[c] || c).join('')
    },
    {
      id: 'unizalgo', category: 'unicode', name: 'Z̷̢a̸̡l̵̨g̶̢o̷̧ (글리치)', preview: 'H̵̡e̷̢l̸̡l̶̨o̷',
      desc: '발음 구별 기호를 겹쳐 노이즈가 낀 듯한 글리치 텍스트를 만듭니다.', example: '"Hello" → "H̵̡e̷̢l̸̡l̶̨o̷"',
      fn: (t) => {
        const marks = ['\u030d','\u030e','\u0304','\u0305','\u033f','\u0311','\u0306','\u0310','\u0352','\u0337','\u0338','\u0321','\u0322','\u0327','\u0328'];
        return Array.from(t).map(c => {
          if (/\s/.test(c)) return c;
          let out = c;

  const CATEGORY_LABELS = {
    basic: '기본 대소문자 (Basic)',
    programming: '프로그래밍 네이밍 규칙 (Programming)',
    clean: '공백 정리 및 라인 도구 (Clean & Line)',
    fun: '재미 및 특수 효과 (Fun)',
    encode: '인코딩 및 암호 복호화 (Encode / Decode)',
    unicode: '유니코드 텍스트 스타일 (Unicode Styles)'
  };

  // --- State ---
  let state = {
    theme: 'light',
    activeCategory: 'all',
    selectedConvId: 'camelcase',
    lineByLine: true,
    liveMode: true,
    decodeMode: false,
    lastInput: 'Hello World! Welcome to Mini Text Converter.\nparseHTMLString & getUserID_v2\n안녕하세요 반갑습니다 2026'
  };

  // DOM Elements
  const inputText = document.getElementById('inputText');
  const outputText = document.getElementById('outputText');
  const activeOpBadge = document.getElementById('activeOpBadge');
  const conversionsContainer = document.getElementById('conversionsContainer');
  const lineByLineCheck = document.getElementById('lineByLineCheck');
  const liveModeCheck = document.getElementById('liveModeCheck');
  const modeEncodeBtn = document.getElementById('modeEncodeBtn');
  const modeDecodeBtn = document.getElementById('modeDecodeBtn');
  const helpModal = document.getElementById('helpModal');
  const helpModalBody = document.getElementById('helpModalBody');
  const helpSearchInput = document.getElementById('helpSearchInput');

  // --- Initialization ---
  function init() {
    loadSavedState();

    document.documentElement.setAttribute('data-theme', state.theme);
    lineByLineCheck.checked = state.lineByLine;
    liveModeCheck.checked = state.liveMode;
    inputText.value = state.lastInput;
    updateEncodeModeButtons();

    renderConversionDeck();
    renderHelpModalContent('');
    runConversion(state.selectedConvId);
    updateMetrics();
  }

  function loadSavedState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const parsed = JSON.parse(raw);
      state = { ...state, ...parsed };
    } catch (_) {}
  }

  function saveState() {
    try {
      state.lastInput = inputText.value;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (_) {}
  }

  function showToast(msg) {
    const toast = document.getElementById('toastBox');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  // --- Metrics Calculation ---
  function computeStats(str) {
    const chars = Array.from(str).length;
    const trimmed = str.trim();
    const words = trimmed ? trimmed.split(/\s+/).length : 0;
    const lines = str ? str.split(/\r?\n/).length : 0;
    const sentences = trimmed ? (trimmed.match(/[.!?]+(?=\s|$)/g) || [1]).length : 0;
    const bytes = utf8Encoder.encode(str).length;
    return { chars, words, lines, sentences, bytes };
  }

  function formatBytes(b) {
    if (b < 1024) return `${b} B`;
    if (b < 1048576) return `${(b / 1024).toFixed(1)} KB`;
    return `${(b / 1048576).toFixed(2)} MB`;
  }

  function updateMetrics() {
    const inStat = computeStats(inputText.value);
    document.getElementById('inputMetrics').innerHTML = `
      <span>글자: <b>${inStat.chars.toLocaleString()}</b></span>
      <span>단어: <b>${inStat.words.toLocaleString()}</b></span>
      <span>줄: <b>${inStat.lines.toLocaleString()}</b></span>
      <span>문장: <b>${inStat.sentences.toLocaleString()}</b></span>
      <span>바이트: <b>${formatBytes(inStat.bytes)}</b></span>
    `;

    const outStat = computeStats(outputText.value);
    document.getElementById('outputMetrics').innerHTML = `
      <span>글자: <b>${outStat.chars.toLocaleString()}</b></span>
      <span>단어: <b>${outStat.words.toLocaleString()}</b></span>
      <span>줄: <b>${outStat.lines.toLocaleString()}</b></span>
      <span>바이트: <b>${formatBytes(outStat.bytes)}</b></span>
    `;
  }

  // --- Conversion Execution ---
  function runConversion(convId) {
    const item = CONVERSIONS.find(c => c.id === convId) || CONVERSIONS[0];
    state.selectedConvId = item.id;

    const suffix = (item.category === 'encode' && state.decodeMode && item.id !== 'rot13') ? ' (Decode)' : '';
    activeOpBadge.textContent = item.name + suffix;

    const result = item.fn(inputText.value, {
      lineByLine: state.lineByLine,
      decode: state.decodeMode
    });

    outputText.value = result;
    updateActiveButtonHighlight();
    updateMetrics();
    saveState();
  }

  function updateActiveButtonHighlight() {
    document.querySelectorAll('.conv-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.id === state.selectedConvId);
    });
  }

  // --- Render Conversion Buttons Deck ---
  function renderConversionDeck() {
    conversionsContainer.innerHTML = '';

    const categoriesToRender = state.activeCategory === 'all'
      ? Object.keys(CATEGORY_LABELS)
      : [state.activeCategory];

    categoriesToRender.forEach(catKey => {
      const items = CONVERSIONS.filter(c => c.category === catKey);
      if (items.length === 0) return;

      const sec = document.createElement('div');
      sec.className = 'conv-section';

      const label = document.createElement('div');
      label.className = 'conv-section-label';
      label.textContent = CATEGORY_LABELS[catKey];
      sec.appendChild(label);

      const grid = document.createElement('div');
      grid.className = 'conv-grid';

      items.forEach(item => {
        const btn = document.createElement('button');
        btn.className = `conv-btn ${item.id === state.selectedConvId ? 'active' : ''}`;
        btn.dataset.id = item.id;
        btn.title = `${item.desc}\n예시: ${item.example}`;
        btn.innerHTML = `
          <span class="conv-btn-name">${item.name}</span>
          <span class="conv-btn-preview">${item.preview}</span>
        `;
        btn.addEventListener('click', () => {
          runConversion(item.id);
        });
        grid.appendChild(btn);
      });

      sec.appendChild(grid);
      conversionsContainer.appendChild(sec);
    });
  }

  // --- Render Searchable Help Modal ---
  function renderHelpModalContent(query = '') {
    const q = query.trim().toLowerCase();
    helpModalBody.innerHTML = '';

    Object.keys(CATEGORY_LABELS).forEach(catKey => {
      const filtered = CONVERSIONS.filter(c => {
        if (c.category !== catKey) return false;
        if (!q) return true;
        return (
          c.name.toLowerCase().includes(q) ||
          c.desc.toLowerCase().includes(q) ||
          c.example.toLowerCase().includes(q)
        );
      });

      if (filtered.length === 0) return;

      const block = document.createElement('div');
      block.innerHTML = `<div class="help-category-title">${CATEGORY_LABELS[catKey]}</div>`;

      const table = document.createElement('table');
      table.className = 'help-table';
      table.innerHTML = `
        <thead>
          <tr>
            <th style="width: 190px;">변환 이름</th>
            <th>기능 설명</th>
            <th style="width: 270px;">변환 예시 (Before → After)</th>
          </tr>
        </thead>
        <tbody>
          ${filtered.map(item => `
            <tr>
              <td><b>${item.name}</b></td>
              <td>${item.desc}</td>
              <td><span class="help-code">${item.example}</span></td>
            </tr>
          `).join('')}
        </tbody>
      `;

      block.appendChild(table);
      helpModalBody.appendChild(block);
    });

    if (helpModalBody.children.length === 0) {
      helpModalBody.innerHTML = `<div style="text-align:center; padding: 36px; color: var(--text-muted);">검색어와 일치하는 변환 규칙이 없습니다.</div>`;
    }
  }

  // --- Event Listeners ---
  inputText.addEventListener('input', () => {
    if (state.liveMode) {
      runConversion(state.selectedConvId);
    } else {
      updateMetrics();
      saveState();
    }
  });

  outputText.addEventListener('input', updateMetrics);

  // Category Tabs
  document.getElementById('categoryTabs').addEventListener('click', (e) => {
    const tab = e.target.closest('.cat-tab');
    if (!tab) return;
    state.activeCategory = tab.dataset.cat;
    document.querySelectorAll('.cat-tab').forEach(t => t.classList.toggle('active', t === tab));
    renderConversionDeck();
    saveState();
  });

  // Options Toggles
  lineByLineCheck.addEventListener('change', () => {
    state.lineByLine = lineByLineCheck.checked;
    runConversion(state.selectedConvId);
  });

  liveModeCheck.addEventListener('change', () => {
    state.liveMode = liveModeCheck.checked;
    if (state.liveMode) runConversion(state.selectedConvId);
    saveState();
  });

  function updateEncodeModeButtons() {
    modeEncodeBtn.classList.toggle('active', !state.decodeMode);
    modeDecodeBtn.classList.toggle('active', state.decodeMode);
  }

  modeEncodeBtn.addEventListener('click', () => {
    state.decodeMode = false;
    updateEncodeModeButtons();
    runConversion(state.selectedConvId);
  });

  modeDecodeBtn.addEventListener('click', () => {
    state.decodeMode = true;
    updateEncodeModeButtons();
    runConversion(state.selectedConvId);
  });

  // Input / Output Toolbar Actions
  document.getElementById('pasteBtn').addEventListener('click', async () => {
    try {
      const clipText = await navigator.clipboard.readText();
      inputText.value = clipText;
      inputText.dispatchEvent(new Event('input'));
      showToast('클립보드 내용을 붙여넣었습니다.');
    } catch (_) {
      inputText.focus();
      showToast('브라우저 권한 제한으로 직접 Ctrl+V를 눌러주세요.');
    }
  });

  document.getElementById('clearInputBtn').addEventListener('click', () => {
    inputText.value = '';
    outputText.value = '';
    updateMetrics();
    saveState();
    inputText.focus();
  });

  document.getElementById('sampleBtn').addEventListener('click', () => {
    inputText.value = 'Hello World! Welcome to Mini Text Converter.\nparseHTMLString & getUserID_v2\n안녕하세요 반갑습니다 2026';
    runConversion(state.selectedConvId);
    showToast('샘플 텍스트를 불러왔습니다.');
  });

  document.getElementById('chainToInputBtn').addEventListener('click', () => {
    if (!outputText.value) return;
    inputText.value = outputText.value;
    updateMetrics();
    saveState();
    showToast('변환 결과를 왼쪽 입력창으로 가져왔습니다.');
  });

  document.getElementById('copyResultBtn').addEventListener('click', () => {
    if (!outputText.value) return;
    outputText.select();
    document.execCommand('copy');
    window.getSelection()?.removeAllRanges();
    showToast('변환 결과가 클립보드에 복사되었습니다.');
  });

  // File Open & Save
  const fileInput = document.getElementById('fileInput');
  document.getElementById('openFileBtn').addEventListener('click', () => {
    fileInput.value = '';
    fileInput.click();
  });

  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const text = await file.text();
    inputText.value = text;
    runConversion(state.selectedConvId);
    showToast(`'${file.name}' 파일을 불러왔습니다.`);
  });

  document.getElementById('saveResultBtn').addEventListener('click', () => {
    const content = outputText.value;
    if (!content) return;
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `converted_${state.selectedConvId}.txt`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('변환 결과가 파일로 저장되었습니다.');
  });

  // Theme Toggle
  document.getElementById('themeToggleBtn').addEventListener('click', () => {
    state.theme = state.theme === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', state.theme);
    saveState();
  });

  // Help Modal Controls
  document.getElementById('openHelpBtn').addEventListener('click', () => {
    helpModal.classList.add('open');
    helpSearchInput.focus();
  });

  document.getElementById('closeHelpBtn').addEventListener('click', () => {
    helpModal.classList.remove('open');
  });

  helpModal.addEventListener('click', (e) => {
    if (e.target === helpModal) helpModal.classList.remove('open');
  });

  helpSearchInput.addEventListener('input', (e) => {
    renderHelpModalContent(e.target.value);
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && helpModal.classList.contains('open')) {
      helpModal.classList.remove('open');
    }
  });

  window.onload = init;
</script>
</body>
</html>
